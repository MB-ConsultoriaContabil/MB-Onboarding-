<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#65472f">
  <meta name="description" content="Acompanhamento de onboarding de clientes da MB Consultoria Contábil.">
  <title>Onboarding de Clientes · MB Consultoria Contábil</title>
  <style>
    :root{color-scheme:light;--bg:#f3eadc;--panel:#fffaf2;--text:#604832;--muted:#927d68;--accent:#9a7049;--line:#e6d8c3;--soft:#f1e6d5;--green:#63846b;--red:#984d3c;--shadow:0 10px 30px #49351b12}
    [data-theme=dark]{color-scheme:dark;--bg:#1f1812;--panel:#2a2018;--text:#eadccb;--muted:#b39f8b;--accent:#cfa57a;--line:#463629;--soft:#34281e;--shadow:0 10px 30px #0003}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Nunito,"Segoe UI",system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{background:linear-gradient(100deg,#5f4129,#8a6340);color:#fff;padding:14px max(20px,calc((100vw - 1120px)/2));display:flex;align-items:center;gap:20px;flex-wrap:wrap;position:sticky;top:0;z-index:2;box-shadow:0 3px 14px #39251430}.brand{font-weight:700;letter-spacing:.04em}.brand small{display:block;color:#ecd9b8;font-weight:400}.nav{display:flex;gap:8px;flex:1;flex-wrap:wrap}.nav button,.theme{border:1px solid transparent;border-radius:20px;padding:7px 12px;color:#fff;background:transparent}.nav button:hover,.nav button.active{border-color:#d9c0a0;background:#ffffff12}.theme{border-color:#d9c0a0}.wrap{max-width:1120px;margin:26px auto;padding:0 16px}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}h1{font-size:23px;font-weight:500;margin:0}h2{font-size:14px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--accent);margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}.card,.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.stat strong{font-size:26px;font-weight:500;color:var(--accent);display:block}.stat span,small,.muted{color:var(--muted)}.columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid var(--accent);border-radius:999px;background:var(--accent);color:white;padding:8px 16px;font-weight:700}.btn.secondary{background:transparent;color:var(--accent)}.btn.danger{background:var(--red);border-color:var(--red)}.field{display:grid;gap:4px;margin:0 0 12px}.field label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}input,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;background:var(--panel);color:var(--text)}input:focus,select:focus{outline:2px solid #9a704955;border-color:var(--accent)}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tools input{max-width:340px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:540px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}.link{color:var(--accent);font-weight:700;text-decoration:none}.link:hover{text-decoration:underline}.badge{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--soft);font-size:12px}.progress{height:7px;background:var(--line);border-radius:8px;overflow:hidden;min-width:70px}.progress i{height:100%;display:block;background:linear-gradient(90deg,#d9c0a0,var(--accent))}.stage{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.stage:last-child{border:0}.stage input{width:auto}.empty{padding:22px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#49351f;color:white;padding:10px 18px;border-radius:99px;display:none;z-index:5}.foot{padding:22px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:700px){.top{padding:12px 14px;gap:10px}.columns{grid-template-columns:1fr}.wrap{margin:18px auto}.heading{align-items:flex-start}}
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">MB <small>Consultoria Contábil · Onboarding de Clientes</small></div>
    <nav class="nav" aria-label="Navegação">
      <button data-page="home" class="active">Painel</button>
      <button data-page="clients">Clientes</button>
    </nav>
    <button class="theme" id="theme" aria-label="Alternar tema">◐ Tema</button>
  </header>
  <main class="wrap" id="app" aria-live="polite"></main>
  <div class="toast" id="toast" role="status"></div>
  <footer class="foot">Os dados são salvos neste navegador. Faça backups periódicos em Configurações do navegador.</footer>
<script>
(() => {
  const KEY='mb-onboarding-site-v1';
  const defaultStages=['Apresentação de proposta','Solicitação de documentos','Viabilidade e legalização','Emissão e assinatura do contrato','Cadastro nas plataformas','Boas-vindas ao cliente','Salvar documentos na pasta','Finalização'];
  const read=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{clients:[]}}catch{return{clients:[]}}};
  let db=read(),page='home',filter='';
  const app=document.querySelector('#app');
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const toast=t=>{const el=document.querySelector('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',2400)};
  const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
  const pct=c=>{const total=c.stages.length;return total?Math.round(c.stages.filter(Boolean).length*100/total):0};
  const date=d=>d?new Date(d+'T00:00:00').toLocaleDateString('pt-BR'):'—';
  const clientLink=c=>`<a class="link" href="#client/${encodeURIComponent(c.id)}">${esc(c.name)}</a>`;
  function header(title,action=''){return `<div class="heading"><h1>${title}</h1>${action}</div>`}
  function home(){const active=db.clients.filter(c=>c.status==='Em andamento'),done=db.clients.filter(c=>c.status==='Finalizado');app.innerHTML=header('Painel',`<button class="btn" id="new">+ Novo cliente</button>`)+`<section class="grid"><div class="stat"><strong>${active.length}</strong><span>Em onboarding</span></div><div class="stat"><strong>${done.length}</strong><span>Finalizados</span></div><div class="stat"><strong>${db.clients.length}</strong><span>Total de clientes</span></div></section><section class="columns"><div class="card"><h2>Onboardings em andamento</h2>${active.length?active.map(c=>`<p>${clientLink(c)}<div class="progress"><i style="width:${pct(c)}%"></i></div><small>${pct(c)}% concluído</small></p>`).join(''):'<p class="empty">Nenhum onboarding em andamento.</p>'}</div><div class="card"><h2>Comece por aqui</h2><p class="muted">Cadastre um cliente para acompanhar as etapas do onboarding em um só lugar.</p><button class="btn" id="new2">Cadastrar cliente</button></div></section>`;document.querySelectorAll('#new,#new2').forEach(b=>b.onclick=()=>form())}
  function clients(){const list=db.clients.filter(c=>(c.name+' '+c.doc).toLowerCase().includes(filter.toLowerCase()));app.innerHTML=header('Clientes',`<button class="btn" id="new">+ Novo cliente</button>`)+`<section class="card"><div class="tools"><input id="search" placeholder="Buscar por nome ou CNPJ/CPF" value="${esc(filter)}" aria-label="Buscar clientes"><select id="status" aria-label="Filtrar status"><option value="">Todos os status</option>${['Em andamento','Finalizado','Cancelado'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="tablewrap"><table><thead><tr><th>Cliente</th><th>CNPJ / CPF</th><th>Progresso</th><th>Status</th></tr></thead><tbody>${list.map(c=>`<tr data-status="${esc(c.status)}"><td>${clientLink(c)}</td><td>${esc(c.doc||'—')}</td><td><div class="progress"><i style="width:${pct(c)}%"></i></div><small>${pct(c)}%</small></td><td><span class="badge">${esc(c.status)}</span></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Nenhum cliente encontrado.</td></tr>'}</tbody></table></div></section>`;document.querySelector('#new').onclick=()=>form();document.querySelector('#search').oninput=e=>{filter=e.target.value;clients();const x=document.querySelector('#search');x.focus();x.setSelectionRange(filter.length,filter.length)};document.querySelector('#status').onchange=e=>document.querySelectorAll('tbody tr[data-status]').forEach(r=>r.hidden=!!e.target.value&&r.dataset.status!==e.target.value)}
  function form(c){const edit=!!c;app.innerHTML=header(edit?'Editar cliente':'Novo cliente',`<button class="btn secondary" id="back">Voltar</button>`)+`<section class="card"><form id="form"><div class="columns"><div class="field"><label for="name">Nome do cliente *</label><input id="name" required maxlength="120" value="${esc(c?.name)}"></div><div class="field"><label for="doc">CNPJ / CPF</label><input id="doc" maxlength="24" value="${esc(c?.doc)}" placeholder="00.000.000/0000-00"></div></div><div class="columns"><div class="field"><label for="start">Data de início</label><input id="start" type="date" value="${esc(c?.start)}"></div><div class="field"><label for="status">Status</label><select id="status">${['Em andamento','Finalizado','Cancelado'].map(s=>`<option ${c?.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div><h2>Etapas do onboarding</h2><div id="stages">${(c?.stages||defaultStages.map(()=>false)).map((done,i)=>`<label class="stage"><input type="checkbox" ${done?'checked':''}><span>${esc(defaultStages[i]||'Etapa '+(i+1))}</span><small>${done?'Concluída':'Pendente'}</small></label>`).join('')}</div><p><button class="btn" type="submit">${edit?'Salvar alterações':'Cadastrar cliente'}</button> ${edit?'<button class="btn danger" id="delete" type="button">Excluir cliente</button>':''}</p></form></section>`;document.querySelector('#back').onclick=()=>{page='clients';render()};document.querySelector('#form').onsubmit=e=>{e.preventDefault();const stages=[...document.querySelectorAll('#stages input')].map(x=>x.checked);const obj={id:c?.id||crypto.randomUUID(),name:document.querySelector('#name').value.trim(),doc:document.querySelector('#doc').value.trim(),start:document.querySelector('#start').value,status:document.querySelector('#status').value,stages};if(edit)db.clients[db.clients.findIndex(x=>x.id===c.id)]=obj;else db.clients.push(obj);save();page='clients';render();toast('Cliente salvo com sucesso.')};document.querySelector('#stages').onchange=e=>{if(e.target.matches('input'))e.target.parentElement.querySelector('small').textContent=e.target.checked?'Concluída':'Pendente'};if(edit)document.querySelector('#delete').onclick=()=>{if(confirm(`Excluir o onboarding de ${c.name}?`)){db.clients=db.clients.filter(x=>x.id!==c.id);save();page='clients';render();toast('Cliente excluído.')}}}
  function detail(id){const c=db.clients.find(x=>x.id===id);if(!c){page='clients';render();return}app.innerHTML=header(esc(c.name),`<button class="btn secondary" id="back">← Clientes</button>`)+`<section class="grid"><div class="stat"><strong>${pct(c)}%</strong><span>Progresso</span></div><div class="stat"><strong>${esc(c.status)}</strong><span>Status</span></div><div class="stat"><strong>${date(c.start)}</strong><span>Início</span></div></section><section class="card"><h2>Checklist de onboarding</h2>${c.stages.map((done,i)=>`<label class="stage"><input type="checkbox" data-i="${i}" ${done?'checked':''}><span>${esc(defaultStages[i]||'Etapa '+(i+1))}</span><small>${done?'Concluída':'Pendente'}</small></label>`).join('')}<p><button class="btn secondary" id="edit">Editar cadastro</button></p></section>`;document.querySelector('#back').onclick=()=>{page='clients';render()};document.querySelector('#edit').onclick=()=>form(c);app.querySelectorAll('[data-i]').forEach(x=>x.onchange=()=>{c.stages[+x.dataset.i]=x.checked;if(c.stages.every(Boolean)&&c.status==='Em andamento')c.status='Finalizado';else if(!c.stages.every(Boolean)&&c.status==='Finalizado')c.status='Em andamento';save();detail(id)})}
  function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='home')home();else if(page==='clients')clients();else detail(decodeURIComponent(location.hash.split('/')[1]||''))}
  document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;filter='';render()});document.querySelector('#theme').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'';localStorage.setItem('mb-theme',dark?'dark':'light')};if(localStorage.getItem('mb-theme')==='dark')document.documentElement.dataset.theme='dark';window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#client/')){page='detail';render()}else{page='clients';render()}});render();
})();
</script>
</body>
</html>
